x-airflow-common: &airflow-common
  image: airflow-crypto:latest
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    DATA_DIR: /opt/airflow/data
    REPORTS_DIR: /opt/airflow/include/reports
  volumes:
    - ../dags:/opt/airflow/dags
    - ../include:/opt/airflow/include
    - ../data:/opt/airflow/data
    - ../logs:/opt/airflow/logs
  depends_on:
    - postgres

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      [
        "bash",
        "-c",
        "airflow db migrate && airflow users create --username airflow --firstname Admin --lastname User --role Admin --email admin@example.com --password airflow",
      ]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      DATA_DIR: /opt/airflow/data
      REPORTS_DIR: /opt/airflow/include/reports
    depends_on:
      postgres:
        condition: service_healthy
    user: "0:0"

  webserver:
    <<: *airflow-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
